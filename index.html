/* Conversation UI */

async function loadRoom({initial=false,older=false,next=false,bottom=false}={}){
  const selected=room, term=query, epoch=authEpoch;
  if((older||next)&&!messageRows.length)return;
  if(newer&&!initial&&!older&&!next&&!bottom)return;
  const params=new URLSearchParams();
  if(term)params.set('q',term);
  if(older)params.set('before',messageRows[0].id);
  if(next)params.set('after',messageRows.at(-1).id);
  if(initial&&!term&&currentRoom()?.unread)params.set('from','unread');
  const result=await api('/chat/'+selected+'?'+params);
  if(epoch!==authEpoch||room!==selected||term!==query)return;
  roomData=result;
  if(initial&&!term){
    const r=currentRoom();
    firstUnread=result.messages.find(m=>m.id>r.read&&m.sender!==me.id&&!m.deleted)?.id||0;
  }
  if(next){messageRows=[...messageRows,...result.messages];newer=result.newer;}
  else if(older){const index=new Map([...result.messages,...messageRows].map(m=>[m.id,m]));messageRows=[...index.values()].sort((a,b)=>a.id-b.id);more=result.more;}
  else if(!initial&&messageRows.length>40){
    const edge=result.messages[0]?.id||0;
    messageRows=[...messageRows.filter(m=>m.id<edge),...result.messages];
  }else{messageRows=result.messages;more=result.more;newer=result.newer;}
  renderMessages({initial,prepend:older,bottom,preserve:next});
  markRead();
}

function markRead(){
  clearTimeout(readTimer);

  const box=$('messages');if(!box)return;
  const bounds=box.getBoundingClientRect();
  let read=currentRoom()?.read||0;
  for(const item of box.querySelectorAll('article'))if(item.getBoundingClientRect().top<bounds.bottom&&item.getBoundingClientRect().bottom>bounds.top)read=Math.max(read,Number(item.id.slice(2)));
  if(read<=(currentRoom()?.read||0))return;

}

function xhrSend(entry,work){
  return new Promise((resolve,reject)=>{
    const params=new URLSearchParams({nonce:entry.nonce});
    const metadata=new TextEncoder().encode(JSON.stringify({name:entry.name,text:entry.text,reply:entry.reply,voice:!!entry.voice,thumbnailSize:entry.thumbnail?.size||0}));
    const size=new Uint8Array(4);new DataView(size.buffer).setUint32(0,metadata.length);
    const xhr=new XMLHttpRequest();work.xhr=xhr;
    xhr.open('POST','/api/chat/'+entry.room+'/send?'+params);
    xhr.setRequestHeader('Content-Type','application/octet-stream');
    xhr.timeout=120000;
    xhr.upload.onprogress=event=>{const bar=$('progress-'+entry.key);if(bar&&event.lengthComputable)bar.value=event.loaded/event.total*100;};
    xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)return resolve();let error='Не удалось отправить файл.';try{error=JSON.parse(xhr.responseText).error;}catch{}reject(Object.assign(Error(error),{status:xhr.status}));};
    xhr.onerror=xhr.ontimeout=xhr.onabort=()=>reject(Error('Передача прервана.'));

  });
}
async function flush(){
  if(!me||!navigator.onLine||pending.size)return;
  const item=outbox.find(e=>!e.error);if(!item)return;
  const epoch=authEpoch,work={};pending.set(item.key,work);renderOutbox();
  try{
    if(item.blob)await xhrSend(item,work);
    else await api('/chat/'+item.room+'/send?nonce='+item.nonce,{text:item.text,reply:item.reply,forward:item.forward});
    if(epoch!==authEpoch)return;
    outbox=outbox.filter(e=>e.key!==item.key);
    await remove(item.key).catch(()=>{});
    if(item.room===room&&!query)loadRoom({bottom:true}).catch(()=>{});
  }catch(error){
    if(epoch!==authEpoch||!outbox.includes(item))return;
    if(error.status===401){reset();return;}
    if(error.status&&error.status!==429&&error.status<500){item.error=error.message;await put(item).catch(()=>{});}
    else{setTimeout(flush,3500);return;}
  }finally{
    if(epoch===authEpoch){pending.delete(item.key);renderOutbox();}
  }
  flush();
}

async function imageBlob(source,width,height,size,quality){
  const ratio=Math.min(1,size/Math.max(width,height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(width*ratio));canvas.height=Math.max(1,Math.round(height*ratio));
  canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);
  const result=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));
  if(!result)throw Error('Не удалось обработать изображение.');
  return result;
}
async function compress(file,size=1280,quality=.8){
  const image=await createImageBitmap(file);
  try{return await imageBlob(image,image.width,image.height,size,quality);}finally{image.close();}
}
async function videoAssets(file,convert){
  const url=URL.createObjectURL(file),video=document.createElement('video');
  video.preload='auto';video.playsInline=true;
  let stream,recorder,blob,thumbnail;
  try{
    await new Promise((resolve,reject)=>{
      video.onloadeddata=resolve;video.onerror=reject;video.src=url;
      setTimeout(()=>reject(Error('Не удалось прочитать видео.')),6000);
    });
    thumbnail=await imageBlob(video,video.videoWidth,video.videoHeight,320,.68);
    if(convert&&video.captureStream&&window.MediaRecorder&&MediaRecorder.isTypeSupported('video/webm')&&video.duration<=25){
      toast('Сжимаем видео на устройстве…');
      stream=video.captureStream();
      const chunks=[];
      recorder=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:1400000,audioBitsPerSecond:96000});
      const encoded=new Promise(resolve=>{
        recorder.ondataavailable=event=>chunks.push(event.data);
        recorder.onstop=()=>resolve(chunks.length?new Blob(chunks,{type:'video/webm'}):null);
      });
      recorder.start(500);
      video.onended=()=>{if(recorder.state==='recording')recorder.stop();};
      await video.play();
      const timeout=setTimeout(()=>{if(recorder.state==='recording')recorder.stop();},30000);
      try{blob=await encoded;}finally{clearTimeout(timeout);}
    }
  }catch{}finally{
    if(recorder?.state==='recording')recorder.stop();
    stream?.getTracks().forEach(track=>track.stop());video.pause();video.removeAttribute('src');video.load();URL.revokeObjectURL(url);
  }

}
async function attach(file){
  const selected=room;
  const picture=/^image\/(png|jpeg|webp)$/.test(file.type);

  if(file.size>100*1048576)throw Error('Выберите файл до 100 МБ для обработки на устройстве.');
  const assets=kind==='video'?await videoAssets(file,file.size>state.limits.video):{};
  const thumbnail=picture?await compress(file,320,.68).catch(()=>null):assets.thumbnail;
  const compressed=picture?await compress(file).catch(()=>file):assets.blob||file;
  const blob=compressed.size<file.size?compressed:file;
  if(blob.size>state.limits[kind])throw Error('Лимит для этого файла — '+mb(state.limits[kind])+'.');
  if(selected!==room)return;
  attachment={blob,thumbnail:thumbnail?.size<=90000&&thumbnail.size<blob.size?thumbnail:null,name:blob===file?file.name:file.name.replace(/\.[^.]+$/,'')+(picture?'.webp':'.webm'),voice:file.type.startsWith('audio/')};

}
async function record(){
  if(recording){recording.recorder.stop();return;}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Запись недоступна в этом браузере.');
  const selected=room,stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(!me||room!==selected){stream.getTracks().forEach(t=>t.stop());return;}
  let recorder;
  try{recorder=new MediaRecorder(stream);}catch(error){stream.getTracks().forEach(t=>t.stop());throw error;}
  const chunks=[];
  const entry={recorder,size:0};
  recorder.ondataavailable=event=>{
    if(!event.data.size)return;
    chunks.push(event.data);entry.size+=event.data.size;
    if(entry.size>state?.limits.audio&&recorder.state!=='inactive')recorder.stop();
  };
  recorder.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    if(recording===entry)recording=null;
    if(!me||room!==selected||entry.discard)return;
    const blob=new Blob(chunks,{type:recorder.mimeType});
    if(!blob.size||blob.size>state.limits.audio)toast('Запись пуста или превышает лимит.');
    else attachment={blob,name:'Голосовое.'+(blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm'),voice:true};
    context();
  };
  recorder.onerror=()=>{entry.discard=true;stream.getTracks().forEach(t=>t.stop());if(recording===entry)recording=null;context();toast('Ошибка записи звука.');};
  recording=entry;recorder.start(1000);context();
}

    app.innerHTML='<main class="welcome"><img src="/icon-192.png" width="58" height="58" alt=""><h1>CLASS CHAT</h1><p>Сервер недоступен. Для входа в чат нужно подключение.</p><div id="reconnect">'+button('reconnect','Проверить соединение','','primary')+'</div></main>';
    app.removeAttribute('aria-busy');
  }
}
boot();
</script>
</head>
